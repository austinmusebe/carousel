[package]
name = "carousel-wallpaper-changer"
version = "0.1.0"
description = "A Cover Flow wallpaper picker for Windows"
authors = ["you"]
edition = "2021"

[lib]
name = "carousel_wallpaper_changer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [
    "protocol-asset",
    "tray-icon",
    "image-png",
    "image-ico",
] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
base64 = "0.22"
rayon = "1.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
] }

[profile.dev]
incremental = true
opt-level = 1

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.release]
lto = true
codegen-units = 4
opt-level = 3
panic = "abort"
strip = true
